name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # configure-pages reads the Pages site settings, which the default
    # contents-only token cannot see.
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      # With a custom domain, configure-pages reports an empty base path and
      # the site builds for the domain root. Without one it builds for
      # https://<owner>.github.io/<repo>/.
      - run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin || 'https://scooterair.tw' }}
          BASE_PATH: ${{ steps.pages.outputs.base_path || '/' }}
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
